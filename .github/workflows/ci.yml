name: TRACE CI - Audit, Security & Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Lint, Test, Scan & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pre-Commit / CI Secret Leak Scan
        run: npm run scan:secrets

      - name: TypeScript Type Check (Strict Lint)
        run: npm run lint

      - name: Run Test Suite (Security & API Contracts)
        run: npm test

      - name: Build Production Bundles (Frontend & Server)
        run: npm run build
